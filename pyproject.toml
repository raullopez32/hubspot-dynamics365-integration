[project]
name = "hubspot-dynamics365-integration"
version = "0.1.0"
description = "HubSpot and Microsoft Dynamics 365 / Dataverse integration service"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "google-cloud-storage>=2.18,<4.0",
    "gunicorn>=22.0,<24.0",
    "msal>=1.31,<2.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
